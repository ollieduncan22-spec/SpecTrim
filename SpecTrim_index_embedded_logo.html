<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// Public Supabase URL and publishable key recovered from the supplied working owner portal.
const URL='https://idkkqpxssxxtznddrujb.supabase.co',KEY='sb_publishable_zxLgavOcB9A8EIcOxoCsKQ_tRWVJKou';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let profile=null,user=null,view='';
const roles={owner:'Platform Owner',platform_manager:'Platform Manager',dealer_admin:'Dealer Group Admin',branch_manager:'Branch Manager',salesperson:'Sales Executive',sales_executive:'Sales Executive'};
function err(t){$('authmsg').textContent=t||''}
function el(tag,attrs={},txt){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt!==undefined)e.textContent=txt;return e}
async function bootstrap(){try{const {data:{user:u},error:e}=await db.auth.getUser();if(e||!u){showLogin();return}const {data:p,error:pe}=await db.from('profiles').select('role,active,dealership_id,branch_id').eq('user_id',u.id).maybeSingle();if(pe)throw pe;if(!p||p.active!==true||!roles[p.role])throw Error('No active staff profile is assigned to this account. Contact your administrator.');user=u;profile=p;const {data:{session}}=await db.auth.getSession();if(session)localStorage.setItem('SpecTrim_auth_session_v1',JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token}));showWorkspace()}catch(e){showLogin();err(e.message)}}
function showLogin(){$('auth').classList.remove('hide');$('workspace').classList.add('hide');$('password').value=''}
function showWorkspace(){$('auth').classList.add('hide');$('workspace').classList.remove('hide');$('who').textContent=(user.email||'Staff')+' · '+roles[profile.role];const n=$('nav');n.replaceChildren();const allowed=profile.role==='owner'?['owner','group','branch','sales']:profile.role==='platform_manager'?['group','branch','sales']:profile.role==='dealer_admin'?['group','branch','sales']:profile.role==='branch_manager'?['branch','sales']:['sales'];for(const key of allowed){const b=el('button',{type:'button',class:'nav'},({owner:'Owner dashboard',group:'Group dashboard',branch:'Branch dashboard',sales:'Sales Assist'})[key]);b.onclick=()=>render(key);b.dataset.key=key;n.append(b)}render(allowed[0])}
function shell(title,subtitle){const c=$('content');c.replaceChildren(el('h1',{class:'heading'},title),el('p',{class:'sub'},subtitle));return c}
function frame(c,file){const f=el('iframe',{class:'frame',src:file,title:'SpecTrim '+file});c.append(f)}
async function counts(c,scope){const cards=el('div',{class:'tiles'});c.append(cards);for(const [name,table] of [['Dealerships','dealerships'],['Branches','branches'],['Vehicles','stock']]){if(scope==='branch'&&table==='dealerships')continue;const tile=el('div',{class:'tile'});tile.append(el('strong',{},'—'),el('span',{},name));cards.append(tile);let q=db.from(table).select('*',{count:'exact',head:true});if(profile.role==='dealer_admin'||profile.role==='branch_manager'){if(profile.dealership_id&&table!=='dealerships')q=q.eq('dealership_id',profile.dealership_id)}if(scope==='branch'&&profile.branch_id&&table==='stock')q=q.eq('branch_id',profile.branch_id);const {count,error}=await q;tile.firstChild.textContent=error?'—':String(count??0);if(error)tile.title=error.message}}
async function render(k){view=k;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.key===k));if(k==='owner'){frame(shell('Owner dashboard','Platform administration and dealership management'),'./owner.html');return}if(k==='sales'){frame(shell('Sales Assist','Find vehicles by features, model and stock'),'./classic.html');return}const c=shell(k==='group'?'Group dashboard':'Branch dashboard',k==='group'?'Dealership group overview':'Branch performance and stock overview');const p=el('section',{class:'panel'});p.append(el('h2',{},'Live dealership overview'),el('p',{class:'muted'},'Figures reflect your Supabase permissions and assigned dealership or branch.'));c.append(p);await counts(c,k);const section=el('section',{class:'panel'});section.append(el('h2',{},'Stock records'));c.append(section);let q=db.from('stock').select('*').limit(12);if(profile.role==='dealer_admin'||profile.role==='branch_manager'){if(profile.dealership_id)q=q.eq('dealership_id',profile.dealership_id)}if(k==='branch'&&profile.branch_id)q=q.eq('branch_id',profile.branch_id);const {data,error}=await q;if(view!==k)return;if(error){section.append(el('p',{class:'status'},error.message));return}if(!data?.length){section.append(el('p',{class:'muted'},'No stock records available to this account.'));return}const keys=Object.keys(data[0]).filter(x=>!['payload','metadata','raw','notes'].includes(x)).slice(0,5);const table=el('table');const tr=el('tr');keys.forEach(x=>tr.append(el('th',{},x.replaceAll('_',' '))));const head=el('thead');head.append(tr);table.append(head);const body=el('tbody');data.forEach(r=>{const row=el('tr');keys.forEach(k=>row.append(el('td',{},String(r[k]??'—').slice(0,90))));body.append(row)});table.append(body);section.append(table)}
$('login').addEventListener('submit',async e=>{e.preventDefault();err('');$('signin').disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const {data:{session}}=await db.auth.getSession();if(session)localStorage.setItem('SpecTrim_auth_session_v1',JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token}));if(!$('remember').checked){sessionStorage.setItem('spectrim_session_only','1')}else{sessionStorage.removeItem('spectrim_session_only')}await bootstrap()}catch(e){err(e.message)}finally{$('signin').disabled=false}});
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){err('Enter your email address first.');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});err(error?error.message:'If the address is registered, a password reset email will be sent.')};
$('signout').onclick=async()=>{await db.auth.signOut();localStorage.removeItem('SpecTrim_auth_session_v1');sessionStorage.removeItem('spectrim_session_only');user=profile=null;showLogin()};
// Session-only selection: clear local persisted auth after the browser tab session ends via sessionStorage sentinel.
if(sessionStorage.getItem('spectrim_session_only')==='1'&&!sessionStorage.getItem('spectrim_tab_live')){await db.auth.signOut();sessionStorage.removeItem('spectrim_session_only')}sessionStorage.setItem('spectrim_tab_live','1');
await bootstrap();
</script></body></html>
